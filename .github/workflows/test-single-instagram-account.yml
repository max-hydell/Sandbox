name: Test one Instagram account

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public Instagram username to test (without @)"
        required: true
        type: string
        default: "pickleballdotcom"

permissions:
  contents: read

concurrency:
  group: instagram-single-account-test
  cancel-in-progress: false

jobs:
  test-one-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ocjepneqzdoharttxgxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_ACCOUNTS_PER_RUN: "1"
      MAX_POSTS_PER_PROFILE: "12"
      TARGET_USERNAME: ${{ inputs.username }}
      RUN_TRIGGER: "single_account_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install worker dependencies
        run: python -m pip install --requirement requirements-worker.txt
      - name: Validate worker syntax
        run: python -m compileall -q worker
      - name: Import only the selected public account
        run: python worker/instagram_import.py
