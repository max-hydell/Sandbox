name: Test Browserless public access
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public Instagram username (read-only)"
        required: true
        type: string
        default: "pickleballdotcom"
permissions:
  contents: read
concurrency:
  group: browserless-public-access-test
  cancel-in-progress: false
jobs:
  browserless-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright client
        run: python -m pip install playwright
      - name: Check Browserless secret exists
        run: |
          if [ -z "$BROWSERLESS_TOKEN" ]; then
            echo "BROWSERLESS_TOKEN secret is missing."
            exit 1
          fi
      - name: Test public pages in Browserless
        run: python worker/browserless_diagnostics.py
      - name: Extract public profile feed with BrowserQL (read-only)
        run: |
          python -m pip install requests
          python worker/browserql_feed_test.py
