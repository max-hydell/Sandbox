name: Test logged-out Instagram browser

on:
  workflow_dispatch:
    inputs:
      username:
        description: "One public Instagram username (without @)"
        required: true
        type: string
        default: "pickleballdotcom"

permissions:
  contents: read

concurrency:
  group: instagram-browser-probe
  cancel-in-progress: false

jobs:
  probe-one-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open one public profile in a fresh logged-out browser
        run: python worker/instagram_browser_probe.py
