name: Diagnose public feed access
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public username to test (without @)"
        required: false
        type: string
        default: "pickleballdotcom"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer test dependency
        run: python -m pip install --requirement requirements-worker.txt
      - name: Validate worker syntax
        run: python -m compileall -q worker
      - name: Run importer parser tests (no database writes)
        run: python -m unittest worker.test_picmany_importer -v
      - name: Run one-shot public endpoint diagnostics
        run: python worker/picmany_diagnostics.py
