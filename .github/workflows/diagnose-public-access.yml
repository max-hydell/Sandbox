name: Diagnose public feed access
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public username to test (without @)"
        required: false
        type: string
        default: "pickleballdotcom"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one-shot public endpoint diagnostics
        run: python worker/picmany_diagnostics.py
