name: Test experimental logged-out Instagram extractor
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public Instagram username (read-only test)"
        required: true
        type: string
        default: "pickleballdotcom"
permissions:
  contents: read
concurrency:
  group: instagram-native-extractor-test
  cancel-in-progress: false
jobs:
  test-native-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable
          rustc --version
          cargo --version
      - name: Build experimental extractor
        run: |
          git clone --depth 1 https://github.com/aagedal/gallery-dl-rs.git /tmp/gallery-dl-rs
          cd /tmp/gallery-dl-rs
          cargo build --release --locked
      - name: Test public profile without cookies or login
        shell: bash
        run: |
          set -o pipefail
          USERNAME="$(python -c 'import os,re; print(re.sub(r"[^A-Za-z0-9._]", "", os.environ["TARGET_USERNAME"]))')"
          if [ -z "$USERNAME" ]; then echo "Invalid username"; exit 2; fi
          timeout 90 /tmp/gallery-dl-rs/target/release/gallery-dl-rs \
            --extractor native -j --range 1-3 \
            "https://www.instagram.com/$USERNAME/" | tee /tmp/instagram-native-test.jsonl
          echo "----- Extracted JSON preview -----"
          head -c 12000 /tmp/instagram-native-test.jsonl
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-native-test-output
          path: /tmp/instagram-native-test.jsonl
          if-no-files-found: ignore
          retention-days: 3
