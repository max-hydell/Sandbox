name: Free Instagram source matrix
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Public Instagram username to test (no login; read-only)"
        required: true
        type: string
        default: "nate_bestic"
permissions:
  contents: read
concurrency:
  group: free-instagram-source-matrix
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TARGET_USERNAME: \${{ inputs.username }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python diagnostics
        run: |
          python -m pip install --upgrade requests instaloader yt-dlp playwright
          python -m playwright install --with-deps chromium
      - name: Install Rust
        run: |
          rustup update stable
          rustc --version
      - name: Build gallery-dl-rs experimental native extractor
        run: |
          git clone --depth 1 https://github.com/aagedal/gallery-dl-rs.git /tmp/gallery-dl-rs
          cd /tmp/gallery-dl-rs
          cargo build --release --locked
      - name: Run free anonymous source matrix
        run: python worker/free_source_matrix.py
      - name: Upload visual and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-source-matrix-\${{ inputs.username }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
