name: Test public feed importer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install --requirement requirements-worker.txt
      - name: Validate worker syntax
        run: python -m compileall -q worker
      - name: Run importer tests
        run: python -m unittest worker.test_picmany_importer -v
