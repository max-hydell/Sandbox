name: Fetch public PicMany posts
on:
  # Keep manual until the first production test confirms all response formats.
  workflow_dispatch:
    inputs:
      username:
        description: "Optional single username for a safe one-profile test"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: picmany-public-import
  cancel-in-progress: false
jobs:
  fetch-public-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://ocjepneqzdoharttxgxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_ACCOUNTS_PER_RUN: "12"
      MAX_ITEMS_PER_PROFILE: "30"
      MAX_PAGES_PER_SECTION: "4"
      PICMANY_REQUEST_DELAY: "3"
      TARGET_USERNAME: ${{ inputs.username }}
      RUN_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install worker dependencies
        run: python -m pip install --requirement requirements-worker.txt
      - name: Validate worker syntax
        run: python -m compileall -q worker
      - name: Import public PicMany content
        run: python worker/instagram_import.py
