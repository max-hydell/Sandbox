name: Fetch public Instagram posts
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-public-import
  cancel-in-progress: false
jobs:
  fetch-public-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://ocjepneqzdoharttxgxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_ACCOUNTS_PER_RUN: "12"
      MAX_POSTS_PER_PROFILE: "12"
      RUN_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install worker dependencies
        run: python -m pip install --requirement requirements-worker.txt
      - name: Validate worker syntax
        run: python -m compileall -q worker
      - name: Import recent public posts
        run: python worker/instagram_import.py
