name: Inspect PicMany public profile
on:
  workflow_dispatch:
    inputs:
      username:
        description: "One public Instagram username (without @)"
        required: true
        type: string
        default: "pickleballdotcom"
permissions:
  contents: read
concurrency:
  group: picmany-profile-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect public profile and available tabs
        run: python worker/picmany_probe.py
