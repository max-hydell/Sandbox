name: Scheduled public Instagram browser check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Public Instagram username to inspect"
        required: true
        type: string
        default: "nate_bestic"
      max_posts:
        description: "Maximum recent visible posts to inspect (1-30)"
        required: true
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: scheduled-public-instagram-browser
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_USERNAME: ${{ github.event.inputs.username || 'nate_bestic' }}
      MAX_POSTS: ${{ github.event.inputs.max_posts || '12' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install browser
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Inspect public profile, posts, and visible carousel slides
        run: python worker/public_browser_collector.py

      - name: Upload extraction report and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-${{ env.TARGET_USERNAME }}-${{ github.run_id }}
          path: artifacts/public-browser/
          if-no-files-found: warn
          retention-days: 14
